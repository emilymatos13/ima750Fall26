 <!DOCTYPE html>

<head>

  <title>Photo Flip Slideshow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slider-container">
    <div class="slides">
      <img class="slide" src="poempage1.png" alt="Photo 1">
      <img class="slide" src="poempage2.png" alt="Photo 2">
      <img class="slide" src="poempage3.png" alt="Photo 3">
    </div>
    
    <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="next" onclick="changeSlide(1)">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
